name: CI

on:
  push:
    branches:
      - main
      - codex/dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify And Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-shared
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Sanitize branch name
        id: sanitize
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          SAFE_REF_NAME="${REF_NAME//\//-}"
          echo "safe_ref_name=$SAFE_REF_NAME" >> $GITHUB_OUTPUT

      - name: Upload branch artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: vrmemoir-${{ steps.sanitize.outputs.safe_ref_name }}-win64
          path: target/release/vrmemoir.exe
          if-no-files-found: error
          retention-days: 14



